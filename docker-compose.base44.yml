services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  web_node_modules:
