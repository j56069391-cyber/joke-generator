services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    labels:
      - base44.project=Joke Generator
      - base44.kind=web
      - base44.port=3000
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
